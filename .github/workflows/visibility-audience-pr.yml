name: Visibility audience PR verification

on:
  push:
    branches: [feat/visibility-audience-preview]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Package local verification inputs
        run: tar -czf "$RUNNER_TEMP/pr422-frontend-fixture.tgz" frontend
      - uses: actions/upload-artifact@v7
        with:
          name: pr422-frontend-verification-inputs
          path: ${{ runner.temp }}/pr422-frontend-fixture.tgz
          retention-days: 1
      - run: npm run release-notes:check
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
