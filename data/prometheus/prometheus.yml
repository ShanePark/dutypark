global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: "spring-actuator"
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scheme: http
    static_configs:
      - targets: [ 'app:8080' ]

  - job_name: "node-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: [ "node-exporter:9100" ]
