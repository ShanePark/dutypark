spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dutypark}
    username: ${DB_USERNAME:dutypark}
    password: ${DB_PASSWORD:PASSWORD_HERE}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  devtools:
    restart:
      enabled: false
  ai:
    openai:
      api-key: "${GEMINI_API_KEY:EMPTY}"
      chat:
        base-url: "https://generativelanguage.googleapis.com/v1beta/openai/"
        options:
          model: "gemma-4-31b-it"
          temperature: 0.0
        completions-path: "/chat/completions"
    rate-limit:
      rpm: 30
      rpd: 14400

server:
  port: 8080
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health, metrics, prometheus"

jwt:
  secret: "${JWT_SECRET}"
  token-validity-in-seconds: 1800
  refresh-token-validity-in-days: 7

cookie:
  secure: ${COOKIE_SSL_ENABLED:true}
  same-site: Lax
  domain: ${DOMAIN_NAME:}

dutypark:
  account-deletion:
    worker:
      fixed-delay-ms: 5000
      initial-delay-ms: 5000
  ai:
    chat:
      connect-timeout: ${AI_CHAT_CONNECT_TIMEOUT:30s}
      read-timeout: ${AI_CHAT_READ_TIMEOUT:120s}
  adminEmails:
    - ${ADMIN_EMAIL:ADMIN@EMAIL.HERE}
  webpush:
    vapid: # npx web-push generate-vapid-keys
      public-key: "${VAPID_PUBLIC_KEY:}"
      private-key: "${VAPID_PRIVATE_KEY:}"
  apns:
    team-id: "${APNS_TEAM_ID:}"
    key-id: "${APNS_KEY_ID:}"
    private-key: "${APNS_PRIVATE_KEY:}"
  login:
    rate-limit:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window-minutes: ${LOGIN_WINDOW_MINUTES:15}
      cleanup-retention-days: ${LOGIN_CLEANUP_DAYS:7}
  oauth:
    authorize-rate-limit:
      max-attempts: ${OAUTH_AUTHORIZE_MAX_ATTEMPTS:30}
      global-max-attempts: ${OAUTH_AUTHORIZE_GLOBAL_MAX_ATTEMPTS:1000}
      window-minutes: ${OAUTH_AUTHORIZE_WINDOW_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  slack:
    token: "${SLACK_TOKEN: }"
  data-go-kr:
    service-key: "${DATA_GO_KR_SERVICE_KEY:DECODED_SERVICE_KEY_HERE}"
  log.path: "/dutypark/logs"
  storage:
    root: /dutypark/storage
    max-file-size: 50MB
    blacklist-ext:
      - exe
      - bat
      - cmd
      - sh
    thumbnail:
      max-side: 200
    session-expiration-hours: 24

oauth:
  web-base-url: "${WEB_OAUTH_BASE_URL:http://localhost:8080}"
  apple:
    client-id: "${APPLE_CLIENT_ID:}"
    web-client-id: "${APPLE_WEB_CLIENT_ID:}"
    web-redirect-uri: "${APPLE_WEB_REDIRECT_URI:}"
    team-id: "${APPLE_TEAM_ID:}"
    key-id: "${APPLE_KEY_ID:}"
    private-key: "${APPLE_PRIVATE_KEY:}"
    credential-encryption-key: "${APPLE_CREDENTIAL_ENCRYPTION_KEY:}"
  kakao:
    rest-api-key: "${KAKAO_REST_API_KEY:KAKAO_REST_API_KEY_HERE}"
  naver:
    client-id: "${NAVER_CLIENT_ID:}"
    client-secret: "${NAVER_CLIENT_SECRET:}"

decorator:
  datasource:
    p6spy:
      enable-logging: false

logging:
  level:
    nl.basjes.parse.useragent: WARN
